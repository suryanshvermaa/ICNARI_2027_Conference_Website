services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icnari27_app_container
    ports:
      - "3000:3000"
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./config/:/app/config/:ro
    depends_on:
      - db
      - s3
    networks:
      - conference_network

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: icnari_conference_db
    ports:
      - "5432:5432"
    volumes:
      - ./db_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    networks:
      - conference_network
  s3:
    image: soldevelo/minio:2026.7.17
    environment:
      - MINIO_ROOT_USER=suryansh
      - MINIO_ROOT_PASSWORD=suryansh
    ports:
      # Map the API port (for S3 clients)
      - "9000:9000"
      # Map the Console port (for the web UI)
      - "9001:9001"
    volumes:
      - ./minio_data:/bitnami/minio/data
    # The command to start the MinIO server and enable the console
    
    command:
      - server
      - /bitnami/minio/data
      - --console-address
      - ":9001"
    networks:
      - conference_network

networks:
  conference_network:
    driver: bridge

volumes:
  db_data: